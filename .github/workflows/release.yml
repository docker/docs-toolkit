name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Vale and check fixture
        uses: vale-cli/vale-action@v3
        with:
          version: 3.17.0
          files: fixtures/valid.md
          reporter: local
          fail_on_error: true

      - name: Test release package
        run: ./scripts/test.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/Docker.zip
          --generate-notes
          --title "${{ github.ref_name }}"
