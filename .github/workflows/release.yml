name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
          VALE_VERSION: 3.17.0
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          gh release download "v${VALE_VERSION}" \
            --repo vale-cli/vale \
            --pattern "$archive" \
            --pattern "vale_${VALE_VERSION}_checksums.txt" \
            --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing "vale_${VALE_VERSION}_checksums.txt"
          tar -xzf "$archive" vale
          sudo install vale /usr/local/bin/vale

      - name: Test release package
        run: ./scripts/test.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          dist/Docker.zip
          --generate-notes
          --title "$TAG"
