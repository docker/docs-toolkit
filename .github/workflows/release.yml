name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Vale and check fixture
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3
        with:
          version: 3.17.0
          files: fixtures/valid.md
          reporter: local
          fail_on_error: true

      - name: Test release package
        run: ./scripts/test.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/Docker.zip
          --generate-notes
          --title "${{ github.ref_name }}"
